<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#fff;}
svg{display:block;}
.grp{cursor:default;}
.grp-bg{opacity:0;transition:opacity .15s;}
.grp:hover .grp-bg{opacity:1;}
.tip{visibility:hidden;opacity:0;transition:opacity .15s;}
.grp:hover .tip{visibility:visible;opacity:1;}
</style>
</head>
<body>
<svg viewBox="0 0 540 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Segoe UI',system-ui,sans-serif">

  <rect width="540" height="180" fill="#ffffff"/>

  <!-- Header -->
  <rect width="540" height="22" fill="#f0fdf4"/>
  <text x="270" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#065f46" letter-spacing="0.06em">SUPPLY CHAIN NETWORK RESILIENCE OPTIMIZATION</text>
  <rect y="22" width="540" height="1" fill="#bbf7d0"/>

  <!-- ── SUPPLIERS (top row) ── -->
  <g class="grp">
    <rect class="grp-bg" x="28" y="28" width="76" height="38" fill="#f0fdf4" rx="4"/>
    <text x="66" y="36" text-anchor="middle" font-size="7" font-weight="700" fill="#065f46">SUPPLIERS</text>
    <circle cx="42" cy="54" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="42" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#166534">S1</text>
    <circle cx="66" cy="54" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="66" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#166534">S2</text>
    <circle cx="90" cy="54" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="90" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#166534">S3</text>
    <rect class="tip" x="28" y="66" width="76" height="14" fill="#14532d" rx="3"/>
    <text class="tip" x="66" y="76" text-anchor="middle" font-size="6.5" fill="#fff">Raw material sources</text>
  </g>

  <!-- ── DCs (middle row) ── -->
  <!-- Normal DCs: DC1, DC3, DC4 -->
  <g class="grp">
    <rect class="grp-bg" x="168" y="28" width="200" height="38" fill="#f0fdf4" rx="4"/>
    <text x="268" y="36" text-anchor="middle" font-size="7" font-weight="700" fill="#065f46">DISTRIBUTION CENTERS</text>
    <!-- DC1 normal -->
    <rect x="178" y="42" width="28" height="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" rx="3"/>
    <text x="192" y="53" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0f766e">DC1</text>
    <!-- DC2 DISRUPTED -->
    <rect x="218" y="40" width="28" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="3"/>
    <text x="232" y="52" text-anchor="middle" font-size="6.5" font-weight="700" fill="#991b1b">DC2</text>
    <line x1="219" y1="41" x2="245" y2="61" stroke="#dc2626" stroke-width="2"/>
    <line x1="245" y1="41" x2="219" y2="61" stroke="#dc2626" stroke-width="2"/>
    <!-- DC3 normal -->
    <rect x="258" y="42" width="28" height="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" rx="3"/>
    <text x="272" y="53" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0f766e">DC3</text>
    <!-- DC4 normal -->
    <rect x="298" y="42" width="28" height="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" rx="3"/>
    <text x="312" y="53" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0f766e">DC4</text>
    <rect class="tip" x="178" y="64" width="148" height="14" fill="#134e4a" rx="3"/>
    <text class="tip" x="252" y="74" text-anchor="middle" font-size="6.5" fill="#fff">DC2 disrupted → cascade propagation</text>
  </g>

  <!-- ── CUSTOMERS (bottom row) ── -->
  <g class="grp">
    <rect class="grp-bg" x="130" y="100" width="260" height="36" fill="#f0fdf4" rx="4"/>
    <text x="260" y="108" text-anchor="middle" font-size="7" font-weight="700" fill="#065f46">CUSTOMERS</text>
    <circle cx="148" cy="124" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="148" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#166534">C1</text>
    <circle cx="178" cy="124" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="178" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#166534">C2</text>
    <circle cx="208" cy="124" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="208" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#991b1b">C3</text>
    <circle cx="238" cy="124" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="238" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#991b1b">C4</text>
    <circle cx="268" cy="124" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="268" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#166534">C5</text>
    <circle cx="298" cy="124" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="298" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#166534">C6</text>
    <circle cx="328" cy="124" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="328" y="127" text-anchor="middle" font-size="5.5" font-weight="700" fill="#166534">C7</text>
    <rect class="tip" x="155" y="134" width="120" height="14" fill="#14532d" rx="3"/>
    <text class="tip" x="215" y="144" text-anchor="middle" font-size="6.5" fill="#fff">Demand nodes (affected = red)</text>
  </g>

  <!-- ── NORMAL EDGES (S→DC, DC→C) ── -->
  <!-- S1→DC1, S2→DC3, S3→DC4 -->
  <line x1="52" y1="62" x2="180" y2="58" stroke="#86efac" stroke-width="1.2"/>
  <line x1="66" y1="62" x2="264" y2="58" stroke="#86efac" stroke-width="1.2"/>
  <line x1="80" y1="62" x2="298" y2="58" stroke="#86efac" stroke-width="1.2"/>
  <!-- DC1→C1,C2 -->
  <line x1="192" y1="60" x2="150" y2="116" stroke="#86efac" stroke-width="1.2"/>
  <line x1="192" y1="60" x2="180" y2="116" stroke="#86efac" stroke-width="1.2"/>
  <!-- DC2→C3,C4 DISRUPTED -->
  <line x1="232" y1="62" x2="210" y2="116" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="232" y1="62" x2="240" y2="116" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- DC3→C5, DC4→C6,C7 -->
  <line x1="272" y1="60" x2="268" y2="116" stroke="#86efac" stroke-width="1.2"/>
  <line x1="312" y1="60" x2="298" y2="116" stroke="#86efac" stroke-width="1.2"/>
  <line x1="312" y1="60" x2="328" y2="116" stroke="#86efac" stroke-width="1.2"/>

  <!-- ── RECOVERY ROUTE (alternative) ── -->
  <g class="grp">
    <path d="M 272,60 Q 248,90 212,116" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <path d="M 272,60 Q 258,92 242,116" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <text x="248" y="86" font-size="7" font-weight="700" fill="#1d4ed8" text-anchor="middle">REROUTE</text>
    <rect class="tip" x="200" y="90" width="120" height="14" fill="#1e3a8a" rx="3"/>
    <text class="tip" x="260" y="100" text-anchor="middle" font-size="6.5" fill="#fff">Adaptive recovery via DC3</text>
  </g>

  <!-- ── DISRUPTION LABEL ── -->
  <rect x="214" y="28" width="40" height="12" fill="#dc2626" rx="2"/>
  <text x="234" y="37" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">DISRUPTED</text>

  <!-- ── RIGHT SIDE: V2G + Climate ── -->
  <g class="grp">
    <rect class="grp-bg" x="406" y="30" width="116" height="100" fill="#f0f9ff" rx="5"/>
    <rect x="410" y="34" width="108" height="94" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" rx="4"/>
    <text x="464" y="46" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">CLIMATE SCENARIOS</text>
    <!-- scenario bars -->
    <rect x="420" y="52" width="88" height="8" fill="#fde68a" stroke="#f59e0b" stroke-width="0.8" rx="1"/>
    <text x="464" y="59" text-anchor="middle" font-size="6" fill="#92400e">High climate stress</text>
    <rect x="420" y="64" width="60" height="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8" rx="1"/>
    <text x="453" y="71" text-anchor="middle" font-size="6" fill="#78350f">Medium stress</text>
    <rect x="420" y="76" width="34" height="8" fill="#fefce8" stroke="#f59e0b" stroke-width="0.8" rx="1"/>
    <text x="440" y="83" text-anchor="middle" font-size="6" fill="#713f12">Low stress</text>
    <!-- V2G -->
    <text x="464" y="98" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">V2G / G2V</text>
    <line x1="425" y1="102" x2="503" y2="102" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="499,99 503,102 499,105" fill="#38bdf8"/>
    <text x="464" y="114" text-anchor="middle" font-size="6" fill="#0369a1">EV Fleet ↔ Grid Integration</text>
    <!-- grid icons -->
    <line x1="428" y1="118" x2="428" y2="126" stroke="#6b7280" stroke-width="1"/>
    <line x1="425" y1="122" x2="431" y2="122" stroke="#6b7280" stroke-width="1"/>
    <text x="436" y="126" font-size="6" fill="#6b7280">Power grid</text>
    <rect class="tip" x="410" y="130" width="108" height="14" fill="#0c4a6e" rx="3"/>
    <text class="tip" x="464" y="140" text-anchor="middle" font-size="6.5" fill="#fff">Stochastic Prog. · Monte Carlo · Robust Opt.</text>
  </g>

  <!-- ── BOTTOM STRIP ── -->
  <rect y="154" width="540" height="26" fill="#f0fdf4"/>
  <line y1="154" x2="540" y2="154" stroke="#bbf7d0" stroke-width="1"/>
  <text x="14" y="165" font-size="7.5" font-weight="700" fill="#374151">Method</text>
  <text x="14" y="176" font-size="7" fill="#6b7280">Stochastic Programming · Monte Carlo Simulation · Robust Optimization · Simulation-Optimization</text>
  <rect x="444" y="157" width="40" height="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="3"/>
  <text x="464" y="168" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Resilience ↑</text>
  <rect x="490" y="157" width="44" height="16" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1" rx="3"/>
  <text x="512" y="168" text-anchor="middle" font-size="7" font-weight="600" fill="#0369a1">Systems · SMPT</text>
</svg>
</body>
</html>
