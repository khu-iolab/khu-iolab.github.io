<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 12px; }
  canvas { border-radius: 10px; display: block; }
  p { color: #475569; font-size: 11px; font-family: system-ui; }
</style>
</head>
<body>
<canvas id="c" width="520" height="340"></canvas>
<p>Truck–Drone Multi-Flight-Level Routing · Canvas Animation</p>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ── Layout constants ──────────────────────────────────────
const PAD = 36, COLS = 8, ROWS = 6;
const CW = (W - PAD * 2) / COLS;
const CH = (H - PAD * 2 - 28) / ROWS;
const gx = (c) => PAD + c * CW;
const gy = (r) => PAD + r * CH;

// ── City blocks (col, row, w, h in grid units) ───────────
const blocks = [
  [1,0,1,1],[3,0,1,1],[5,0,1,1],[7,0,1,1],
  [0,1,1,1],[2,1,1,1],[4,1,1,1],[6,1,1,1],
  [1,2,1,1],[3,2,2,1],[6,2,1,1],
  [0,3,1,1],[2,3,1,1],[5,3,1,1],[7,3,1,1],
  [1,4,1,1],[3,4,1,1],[5,4,2,1],
  [0,5,1,1],[2,5,1,1],[4,5,1,1],[7,5,1,1],
];

// ── Truck route (grid coords) ─────────────────────────────
const TRUCK_ROUTE = [
  [0,0],[2,0],[4,0],[4,2],[4,4],[6,4],[8,4],[8,2],[8,0],[6,0],[6,2],[4,2],[2,2],[0,2],[0,4],[2,4],[2,6],[4,6],[6,6],[8,6],[8,4]
];

// Truck stops (index into TRUCK_ROUTE where drones launch)
const STOPS = [2, 6, 11, 16];

// ── Customers (grid coords, assigned to nearest stop) ─────
const CUSTOMERS = [
  { pos:[3,1], stop:0, fl:1 },
  { pos:[1,1], stop:0, fl:2 },
  { pos:[7,1], stop:1, fl:1 },
  { pos:[5,1], stop:1, fl:3 },
  { pos:[5,3], stop:2, fl:2 },
  { pos:[3,3], stop:2, fl:1 },
  { pos:[3,5], stop:3, fl:1 },
  { pos:[5,5], stop:3, fl:3 },
];

// ── Flight level colors & altitudes ──────────────────────
const FL = {
  1: { color:'#f59e0b', label:'FL1 · 20m',  arcH: 18 },
  2: { color:'#14b8a6', label:'FL2 · 60m',  arcH: 32 },
  3: { color:'#ef4444', label:'FL3 · 120m', arcH: 52 },
};

// ── Animation state ───────────────────────────────────────
let frame = 0;
const TOTAL = 420; // frames per loop

// Convert grid → pixel (center of cell)
function gp(col, row) {
  return { x: PAD + col * CW, y: PAD + row * CH };
}

// Interpolate along truck route
function truckPos(t) {
  const segs = TRUCK_ROUTE.length - 1;
  const f = t * segs;
  const i = Math.min(Math.floor(f), segs - 1);
  const α = f - i;
  const a = gp(...TRUCK_ROUTE[i]);
  const b = gp(...TRUCK_ROUTE[i + 1]);
  return { x: a.x + (b.x - a.x) * α, y: a.y + (b.y - a.y) * α, seg: i };
}

// Arc position between two points with height
function arcPos(ax, ay, bx, by, t, h) {
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2 - h;
  const x = (1-t)*(1-t)*ax + 2*(1-t)*t*mx + t*t*bx;
  const y = (1-t)*(1-t)*ay + 2*(1-t)*t*my + t*t*by;
  return { x, y };
}

function drawGrid() {
  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  // Road grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.8;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(gx(c), PAD); ctx.lineTo(gx(c), H - 28 - PAD + gx(0) - PAD + PAD); ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(PAD, gy(r)); ctx.lineTo(W - PAD, gy(r)); ctx.stroke();
  }

  // Road highlights (truck path)
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = CW * 0.55;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  TRUCK_ROUTE.forEach(([c,r], i) => {
    const p = gp(c,r);
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();

  // City blocks
  ctx.fillStyle = '#263d5c';
  for (const [c, r, w, h] of blocks) {
    const x = gp(c,r).x - CW/2 + 3;
    const y = gp(c,r).y - CH/2 + 3;
    const bw = w * CW - 6;
    const bh = h * CH - 6;
    ctx.fillRect(x, y, bw, bh);
    // Roof highlight
    ctx.fillStyle = '#1e3a5f';
    ctx.fillRect(x, y, bw, 3);
    ctx.fillStyle = '#263d5c';
  }
}

function drawTruckRoute() {
  // Dashed outline of full route
  ctx.save();
  ctx.strokeStyle = 'rgba(59,130,246,0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 5]);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  TRUCK_ROUTE.forEach(([c,r], i) => {
    const p = gp(c,r);
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
  ctx.restore();
}

function drawTruck(t) {
  const pos = truckPos(t);
  // Glow
  const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 14);
  g.addColorStop(0, 'rgba(59,130,246,0.3)');
  g.addColorStop(1, 'rgba(59,130,246,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(pos.x, pos.y, 14, 0, Math.PI*2); ctx.fill();
  // Body
  ctx.fillStyle = '#3b82f6';
  ctx.beginPath(); ctx.arc(pos.x, pos.y, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.stroke();
  return pos;
}

function drawDrones(truckT, truckSeg) {
  const DRONE_DUR = 0.12; // fraction of total loop each drone mission takes

  CUSTOMERS.forEach((c, ci) => {
    const stop = STOPS[c.stop];
    // When does this stop happen along the route?
    const stopT = stop / (TRUCK_ROUTE.length - 1);
    const launch = stopT;
    const land   = stopT + DRONE_DUR;

    // Only show if truck is near this stop
    if (truckT < launch - 0.01 || truckT > land + 0.06) return;

    const fl = FL[c.fl];
    const origin = gp(...TRUCK_ROUTE[stop]);
    const dest   = gp(...c.pos);

    const progress = (truckT - launch) / DRONE_DUR;

    let dx, dy, outbound;
    if (progress <= 0.5) {
      // outbound
      outbound = true;
      const t2 = progress / 0.5;
      const eased = t2 < 0.5 ? 2*t2*t2 : 1-2*(1-t2)*(1-t2);
      const p = arcPos(origin.x, origin.y, dest.x, dest.y, eased, fl.arcH);
      dx = p.x; dy = p.y;
    } else {
      // return
      outbound = false;
      const t2 = (progress - 0.5) / 0.5;
      const eased = t2 < 0.5 ? 2*t2*t2 : 1-2*(1-t2)*(1-t2);
      const p = arcPos(dest.x, dest.y, origin.x, origin.y, eased, fl.arcH * 0.6);
      dx = p.x; dy = p.y;
    }

    // Arc ghost path
    ctx.save();
    ctx.strokeStyle = fl.color + '40';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3,4]);
    ctx.beginPath();
    const steps = 30;
    for (let s = 0; s <= steps; s++) {
      const pt = arcPos(origin.x, origin.y, dest.x, dest.y, s/steps, fl.arcH);
      s === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    ctx.restore();

    // Customer marker
    ctx.fillStyle = outbound ? fl.color : fl.color + '88';
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(dest.x, dest.y, 5, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // Drone dot
    const glow = ctx.createRadialGradient(dx, dy, 0, dx, dy, 10);
    glow.addColorStop(0, fl.color + '60');
    glow.addColorStop(1, fl.color + '00');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(dx, dy, 10, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = fl.color;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(dx, dy, 4.5, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  });
}

function drawStops() {
  STOPS.forEach(idx => {
    const [c,r] = TRUCK_ROUTE[idx];
    const p = gp(c,r);
    ctx.strokeStyle = 'rgba(59,130,246,0.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawDepot() {
  const p = gp(0,0);
  ctx.fillStyle = '#1e40af';
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(p.x-9, p.y-7, 18, 14, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 7px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('DEP', p.x, p.y+3);
}

function drawLegend() {
  const lx = PAD, ly = H - 24;
  ctx.font = '9px system-ui'; ctx.textAlign = 'left';

  let x = lx;
  // Truck
  ctx.fillStyle = '#3b82f6';
  ctx.beginPath(); ctx.arc(x+5, ly, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#64748b'; ctx.fillText('Truck', x+13, ly+3); x += 58;

  // FL1
  ctx.fillStyle = FL[1].color;
  ctx.beginPath(); ctx.arc(x+5, ly, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#64748b'; ctx.fillText(FL[1].label, x+13, ly+3); x += 70;

  // FL2
  ctx.fillStyle = FL[2].color;
  ctx.beginPath(); ctx.arc(x+5, ly, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#64748b'; ctx.fillText(FL[2].label, x+13, ly+3); x += 70;

  // FL3
  ctx.fillStyle = FL[3].color;
  ctx.beginPath(); ctx.arc(x+5, ly, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#64748b'; ctx.fillText(FL[3].label, x+13, ly+3);
}

function loop() {
  frame++;
  const t = (frame % TOTAL) / TOTAL;

  drawGrid();
  drawTruckRoute();
  drawStops();
  drawDrones(t, 0);
  drawDepot();
  drawTruck(t);
  drawLegend();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
