<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-labelledby="title desc">
  <title id="title">지하-지상 통합 라스트마일 VRP 개념도</title>
  <desc id="desc">물류 거점 출발, 지상 라스트마일 차량 경로, 환적 허브, 지하 운송을 보여 주는 논문형 개념도.</desc>
  <defs>
