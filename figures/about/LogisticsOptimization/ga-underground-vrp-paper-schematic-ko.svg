      .font { font-family: "Malgun Gothic", "Noto Sans KR", "Segoe UI", Arial, sans-serif; }
      .caption { font-size: 24px; font-weight: 700; fill: #263238; }
      .small { font-size: 18px; fill: #455a64; }
      .tiny { font-size: 15px; fill: #607d8b; }
      .label { font-size: 31px; font-weight: 750; fill: #263238; }
      .panel-label { font-size: 20px; font-weight: 700; fill: #455a64; letter-spacing: .3px; }
      .road { stroke: #e3e9ee; stroke-width: 24; stroke-linecap: square; }
      .road-center { stroke: #ffffff; stroke-width: 2.2; stroke-dasharray: 14 16; stroke-linecap: round; opacity: .95; }
      .building { fill: #eef3f7; stroke: #aab7c2; stroke-width: 2; }
      .building-top { fill: #f8fafc; stroke: #c4ccd4; stroke-width: 1.5; }
      .node { fill: #fff7ed; stroke: #f97316; stroke-width: 4; }
      .node-text { font-size: 22px; font-weight: 800; fill: #9a3412; }
      .hub { fill: #f0fdfa; stroke: #0f766e; stroke-width: 4; }
      .hub-dark { fill: #0f766e; }
      .hub-icon { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
      .route-blue { fill: none; stroke: #1565c0; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .route-orange { fill: none; stroke: #ef6c00; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .route-teal { fill: none; stroke: #0f766e; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .thin-blue { fill: none; stroke: #1565c0; stroke-width: 3; }
      .thin-teal { fill: none; stroke: #0f766e; stroke-width: 3; }
      .callout { fill: #ffffff; stroke: #90a4ae; stroke-width: 2.2; }
      .legend-box { fill: #ffffff; stroke: #d5dde3; stroke-width: 2; }
    </style>
    <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 17 9 L 2 16 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 17 9 L 2 16 Z" fill="#ef6c00"/>
    </marker>
    <marker id="arrow-teal" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 17 9 L 2 16 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 13 7 L 2 12 Z" fill="#78909c"/>
    </marker>
  </defs>

