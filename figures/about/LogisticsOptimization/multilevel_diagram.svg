<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <rect width="560" height="340" fill="#f8fafc"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f" letter-spacing="0.5">MULTI-FLIGHT-LEVEL DRONE ROUTING</text>

  <!-- ── Level planes ── -->
  <!-- Level 3 (High) -->
  <rect x="40" y="55" width="480" height="64" rx="4" fill="#e8f0fb" stroke="#93b4e8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="52" y="72" font-size="10" font-weight="600" fill="#3b6cb7">FL 3 · High Altitude</text>
  <text x="52" y="84" font-size="9" fill="#6b89b7">Long-range transit / No-fly zone bypass</text>

  <!-- Level 2 (Mid) -->
  <rect x="40" y="133" width="480" height="64" rx="4" fill="#edf7f2" stroke="#7ec9a0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="52" y="150" font-size="10" font-weight="600" fill="#2d7a52">FL 2 · Mid Altitude</text>
  <text x="52" y="162" font-size="9" fill="#5a9a76">Zone-to-zone transfer / Intermediate relay</text>

  <!-- Level 1 (Low) -->
  <rect x="40" y="211" width="480" height="64" rx="4" fill="#fef6ec" stroke="#f0b87a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="52" y="228" font-size="10" font-weight="600" fill="#c47a1e">FL 1 · Low Altitude</text>
  <text x="52" y="240" font-size="9" fill="#c4943e">Last-mile delivery / Customer drop-off</text>

  <!-- Ground -->
  <line x1="40" y1="291" x2="520" y2="291" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="307" font-size="9" fill="#94a3b8">Ground — Truck / Underground Network</text>

  <!-- ── Nodes ── -->
  <!-- Depot (truck) -->
  <rect x="60" y="278" width="34" height="18" rx="3" fill="#334155"/>
  <text x="77" y="291" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">DEPOT</text>

  <!-- FL3 waypoints -->
  <circle cx="180" cy="87" r="7" fill="#3b6cb7" stroke="#fff" stroke-width="1.5"/>
  <circle cx="310" cy="87" r="7" fill="#3b6cb7" stroke="#fff" stroke-width="1.5"/>
  <circle cx="430" cy="87" r="7" fill="#3b6cb7" stroke="#fff" stroke-width="1.5"/>

  <!-- FL2 waypoints -->
  <circle cx="240" cy="165" r="7" fill="#2d7a52" stroke="#fff" stroke-width="1.5"/>
  <circle cx="380" cy="165" r="7" fill="#2d7a52" stroke="#fff" stroke-width="1.5"/>

  <!-- FL1 delivery nodes -->
  <circle cx="150" cy="243" r="6" fill="#c47a1e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="270" cy="243" r="6" fill="#c47a1e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="350" cy="243" r="6" fill="#c47a1e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="460" cy="243" r="6" fill="#c47a1e" stroke="#fff" stroke-width="1.5"/>

  <!-- Customer icons (ground) -->
  <circle cx="155" cy="291" r="5" fill="#64748b"/>
  <circle cx="275" cy="291" r="5" fill="#64748b"/>
  <circle cx="355" cy="291" r="5" fill="#64748b"/>
  <circle cx="460" cy="291" r="5" fill="#64748b"/>

  <!-- ── Routes ── -->
  <!-- Depot → FL3 ascent -->
  <line x1="77" y1="278" x2="180" y2="94" stroke="#3b6cb7" stroke-width="1.8" stroke-dasharray="5,3"/>

  <!-- FL3 route -->
  <polyline points="180,87 310,87 430,87" fill="none" stroke="#3b6cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FL3 → FL2 descent -->
  <line x1="310" y1="94" x2="240" y2="158" stroke="#3b6cb7" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="430" y1="94" x2="380" y2="158" stroke="#3b6cb7" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- FL2 route -->
  <polyline points="240,165 380,165" fill="none" stroke="#2d7a52" stroke-width="2" stroke-linecap="round"/>

  <!-- FL2 → FL1 descent -->
  <line x1="240" y1="172" x2="150" y2="237" stroke="#2d7a52" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="240" y1="172" x2="270" y2="237" stroke="#2d7a52" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="380" y1="172" x2="350" y2="237" stroke="#2d7a52" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="380" y1="172" x2="460" y2="237" stroke="#2d7a52" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- FL1 → Ground delivery -->
  <line x1="150" y1="249" x2="155" y2="286" stroke="#c47a1e" stroke-width="1.6"/>
  <line x1="270" y1="249" x2="275" y2="286" stroke="#c47a1e" stroke-width="1.6"/>
  <line x1="350" y1="249" x2="355" y2="286" stroke="#c47a1e" stroke-width="1.6"/>
  <line x1="460" y1="249" x2="460" y2="286" stroke="#c47a1e" stroke-width="1.6"/>

  <!-- Arrow heads on FL routes -->
  <polygon points="430,87 420,83 420,91" fill="#3b6cb7"/>
  <polygon points="380,165 370,161 370,169" fill="#2d7a52"/>

  <!-- Legend -->
  <rect x="40" y="318" width="480" height="1" fill="#e2e8f0"/>
  <circle cx="60" cy="330" r="4" fill="#3b6cb7"/><text x="70" y="334" font-size="9" fill="#475569">FL 3 Route</text>
  <circle cx="145" cy="330" r="4" fill="#2d7a52"/><text x="155" y="334" font-size="9" fill="#475569">FL 2 Route</text>
  <circle cx="230" cy="330" r="4" fill="#c47a1e"/><text x="240" y="334" font-size="9" fill="#475569">FL 1 Delivery</text>
  <line x1="315" y1="330" x2="330" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/><text x="335" y="334" font-size="9" fill="#475569">Altitude Transition</text>
</svg>
