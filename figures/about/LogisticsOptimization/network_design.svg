<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <rect width="560" height="340" fill="#f8fafc"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f" letter-spacing="0.5">URBAN LOGISTICS NETWORK DESIGN</text>

  <!-- ── Tier labels ── -->
  <text x="30" y="72" font-size="9" font-weight="600" fill="#94a3b8" transform="rotate(-90,30,72)" text-anchor="middle">TIER 1</text>
  <text x="30" y="172" font-size="9" font-weight="600" fill="#94a3b8" transform="rotate(-90,30,172)" text-anchor="middle">TIER 2</text>
  <text x="30" y="272" font-size="9" font-weight="600" fill="#94a3b8" transform="rotate(-90,30,272)" text-anchor="middle">TIER 3</text>

  <!-- Thin tier dividers -->
  <line x1="48" y1="116" x2="530" y2="116" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="48" y1="220" x2="530" y2="220" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ══════════════ TIER 1: Suppliers / Flying Warehouse ══════════════ -->
  <!-- Flying Warehouse -->
  <rect x="220" y="42" width="120" height="40" rx="5" fill="#1d4ed8" opacity="0.9"/>
  <text x="280" y="59" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Flying Warehouse</text>
  <text x="280" y="73" text-anchor="middle" font-size="8.5" fill="#bfdbfe">Airborne Fulfillment Center</text>

  <!-- Supplier nodes -->
  <rect x="68" y="50" width="80" height="30" rx="4" fill="#64748b" opacity="0.85"/>
  <text x="108" y="69" text-anchor="middle" font-size="9" fill="#fff">Supplier A</text>

  <rect x="392" y="50" width="80" height="30" rx="4" fill="#64748b" opacity="0.85"/>
  <text x="432" y="69" text-anchor="middle" font-size="9" fill="#fff">Supplier B</text>

  <!-- ══════════════ TIER 2: Distribution Hubs ══════════════ -->
  <!-- Underground node left -->
  <rect x="58" y="136" width="96" height="36" rx="5" fill="#0f766e" opacity="0.85"/>
  <text x="106" y="151" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">Underground</text>
  <text x="106" y="164" text-anchor="middle" font-size="8" fill="#99f6e4">Hub W</text>

  <!-- Central DC -->
  <rect x="215" y="130" width="130" height="44" rx="5" fill="#1d4ed8" opacity="0.75"/>
  <text x="280" y="149" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Distribution Center</text>
  <text x="280" y="163" text-anchor="middle" font-size="8.5" fill="#bfdbfe">Multi-modal Hub</text>

  <!-- Underground node right -->
  <rect x="406" y="136" width="96" height="36" rx="5" fill="#0f766e" opacity="0.85"/>
  <text x="454" y="151" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">Underground</text>
  <text x="454" y="164" text-anchor="middle" font-size="8" fill="#99f6e4">Hub E</text>

  <!-- ══════════════ TIER 3: Customers ══════════════ -->
  <!-- 5 customer zones -->
  <circle cx="90"  cy="265" r="16" fill="#f59e0b" opacity="0.9"/>
  <text x="90"  y="269" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">C1</text>

  <circle cx="185" cy="265" r="16" fill="#f59e0b" opacity="0.9"/>
  <text x="185" y="269" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">C2</text>

  <circle cx="280" cy="265" r="16" fill="#f59e0b" opacity="0.9"/>
  <text x="280" y="269" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">C3</text>

  <circle cx="375" cy="265" r="16" fill="#f59e0b" opacity="0.9"/>
  <text x="375" y="269" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">C4</text>

  <circle cx="470" cy="265" r="16" fill="#f59e0b" opacity="0.9"/>
  <text x="470" y="269" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">C5</text>

  <!-- ══════════════ CONNECTIONS ══════════════ -->
  <!-- Supplier A → Flying Warehouse -->
  <line x1="148" y1="65" x2="220" y2="62" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Supplier B → Flying Warehouse -->
  <line x1="392" y1="65" x2="340" y2="62" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Flying Warehouse → DC (aerial, dashed) -->
  <line x1="280" y1="82" x2="280" y2="130" stroke="#3b6cb7" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>

  <!-- Flying Warehouse → Underground Hubs (dashed) -->
  <line x1="220" y1="75" x2="140" y2="136" stroke="#3b6cb7" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="340" y1="75" x2="420" y2="136" stroke="#3b6cb7" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Underground ↔ DC (underground, bold) -->
  <line x1="154" y1="154" x2="215" y2="154" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6,2" marker-end="url(#arr-teal)"/>
  <line x1="345" y1="154" x2="406" y2="154" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6,2" marker-end="url(#arr-teal)"/>

  <!-- DC → Customers (truck) -->
  <line x1="235" y1="174" x2="100"  y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="252" y1="174" x2="190"  y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="280" y1="174" x2="280"  y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="308" y1="174" x2="370"  y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Underground Hub E → C4, C5 (truck/drone) -->
  <line x1="454" y1="172" x2="470"  y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="444" y1="172" x2="380"  y2="249" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Drone delivery from DC to C3 (dashed orange) -->
  <line x1="280" y1="174" x2="280" y2="249" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4,3"/>

  <!-- ══════════════ ARROWHEAD MARKERS ══════════════ -->
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#3b6cb7"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#0f766e"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ══════════════ LEGEND ══════════════ -->
  <rect x="40" y="305" width="480" height="1" fill="#e2e8f0"/>
  <rect x="48" y="316" width="18" height="6" rx="1" fill="#1d4ed8" opacity="0.75"/>
  <text x="72" y="323" font-size="9" fill="#475569">Aerial (Drone / Airship)</text>
  <line x1="175" y1="319" x2="195" y2="319" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="200" y="323" font-size="9" fill="#475569">Underground</text>
  <line x1="285" y1="319" x2="305" y2="319" stroke="#64748b" stroke-width="1.5"/>
  <text x="310" y="323" font-size="9" fill="#475569">Truck / Last-mile</text>
  <circle cx="420" cy="319" r="5" fill="#f59e0b" opacity="0.9"/>
  <text x="430" y="323" font-size="9" fill="#475569">Customer Zone</text>
</svg>
