<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#fff;}
svg{display:block;}
.grp{cursor:default;}
.grp-bg{opacity:0;transition:opacity .15s;}
.grp:hover .grp-bg{opacity:1;}
.tip{visibility:hidden;opacity:0;transition:opacity .15s;}
.grp:hover .tip{visibility:visible;opacity:1;}
</style>
</head>
<body>
<svg viewBox="0 0 540 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Segoe UI',system-ui,sans-serif">

  <rect width="540" height="180" fill="#ffffff"/>

  <!-- Header -->
  <rect width="540" height="22" fill="#fff7ed"/>
  <text x="270" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9a3412" letter-spacing="0.06em">SMART MANUFACTURING SIMULATION-OPTIMIZATION PIPELINE</text>
  <rect y="22" width="540" height="1" fill="#fed7aa"/>

  <!-- ══ LEFT: FAB FLOOR ══ -->
  <!-- Bay grid 3×2 -->
  <g class="grp">
    <rect class="grp-bg" x="14" y="26" width="148" height="120" fill="#fff7ed" rx="5"/>
    <rect x="18" y="30" width="140" height="112" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" rx="3"/>
    <text x="88" y="42" text-anchor="middle" font-size="7" font-weight="700" fill="#9a3412">SEMICONDUCTOR FAB FLOOR</text>
    <!-- Bay cells (5 cols × 2 rows) -->
    <!-- Row 1 -->
    <rect x="24" y="46" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="36" y="59" text-anchor="middle" font-size="6" fill="#78350f">B1</text>
    <rect x="52" y="46" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="64" y="59" text-anchor="middle" font-size="6" fill="#78350f">B2</text>
    <rect x="80" y="46" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="92" y="59" text-anchor="middle" font-size="6" fill="#78350f">B3</text>
    <rect x="108" y="46" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="120" y="59" text-anchor="middle" font-size="6" fill="#78350f">B4</text>
    <rect x="136" y="46" width="16" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="144" y="59" text-anchor="middle" font-size="6" fill="#78350f">B5</text>
    <!-- Row 2 -->
    <rect x="24" y="70" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="36" y="83" text-anchor="middle" font-size="6" fill="#78350f">B6</text>
    <rect x="52" y="70" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="64" y="83" text-anchor="middle" font-size="6" fill="#78350f">B7</text>
    <rect x="80" y="70" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="92" y="83" text-anchor="middle" font-size="6" fill="#78350f">B8</text>
    <rect x="108" y="70" width="24" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="120" y="83" text-anchor="middle" font-size="6" fill="#78350f">B9</text>
    <rect x="136" y="70" width="16" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <text x="144" y="83" text-anchor="middle" font-size="6" fill="#78350f">B10</text>
    <!-- OHT Rail -->
    <line x1="24" y1="92" x2="154" y2="92" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="88" y="101" text-anchor="middle" font-size="6.5" font-weight="600" fill="#475569">OHT RAIL</text>
    <!-- OHT vehicle -->
    <rect x="60" y="88" width="18" height="8" fill="#e07820" rx="2"/>
    <text x="69" y="94" text-anchor="middle" font-size="5.5" font-weight="700" fill="#fff">OHT</text>
    <!-- Lot marker -->
    <circle cx="69" cy="84" r="3" fill="#dc2626"/>
    <text x="69" y="110" text-anchor="middle" font-size="6" fill="#6b7280">Discrete-Event Simulation</text>
    <text x="88" y="120" text-anchor="middle" font-size="6" fill="#6b7280">OHT/AGV Dispatch Optimization</text>
    <rect class="tip" x="20" y="128" width="132" height="14" fill="#7c2d12" rx="3"/>
    <text class="tip" x="86" y="138" text-anchor="middle" font-size="6.5" fill="#fff">ML dispatch: FIFO → 5–15% throughput ↑</text>
  </g>

  <!-- ══ CENTER: FEM PIPELINE ══ -->
  <g class="grp">
    <rect class="grp-bg" x="167" y="26" width="200" height="120" fill="#fff7ed" rx="5"/>
    <rect x="171" y="30" width="192" height="112" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" rx="3"/>
    <text x="267" y="42" text-anchor="middle" font-size="7" font-weight="700" fill="#9a3412">FEM → SURROGATE → OPTIMIZATION</text>

    <!-- Step 1: Process Params -->
    <rect x="180" y="48" width="50" height="22" fill="#fed7aa" stroke="#f97316" stroke-width="1.2" rx="3"/>
    <text x="205" y="59" text-anchor="middle" font-size="6.5" font-weight="700" fill="#7c2d12">Process</text>
    <text x="205" y="68" text-anchor="middle" font-size="6" fill="#9a3412">Params</text>
    <text x="205" y="44" text-anchor="middle" font-size="5.5" font-weight="700" fill="#ea580c">INPUT</text>

    <!-- Arrow 1 -->
    <line x1="230" y1="59" x2="242" y2="59" stroke="#f97316" stroke-width="1.5"/>
    <polygon points="241,56 245,59 241,62" fill="#f97316"/>

    <!-- Step 2: FEM Simulation -->
    <rect x="246" y="48" width="50" height="22" fill="#ffedd5" stroke="#f97316" stroke-width="1.2" rx="3"/>
    <text x="271" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#7c2d12">FEM Sim</text>
    <text x="271" y="66" text-anchor="middle" font-size="5.5" fill="#9a3412">Forging · Draw</text>

    <!-- Arrow 2 -->
    <line x1="296" y1="59" x2="308" y2="59" stroke="#f97316" stroke-width="1.5"/>
    <polygon points="307,56 311,59 307,62" fill="#f97316"/>

    <!-- Step 3: DNN Surrogate -->
    <rect x="312" y="48" width="42" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" rx="3"/>
    <text x="333" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#78350f">DNN</text>
    <text x="333" y="66" text-anchor="middle" font-size="5.5" fill="#92400e">Surrogate</text>

    <!-- Curved down from DNN to GA -->
    <path d="M 333,70 Q 333,82 298,82" stroke="#d97706" stroke-width="1.5" fill="none"/>
    <polygon points="299,79 295,82 299,85" fill="#d97706"/>

    <!-- Step 4: GA Optimizer -->
    <rect x="244" y="74" width="50" height="22" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2" rx="3"/>
    <text x="269" y="83" text-anchor="middle" font-size="6.5" font-weight="700" fill="#713f12">GA Optim</text>
    <text x="269" y="92" text-anchor="middle" font-size="5.5" fill="#78350f">Population</text>

    <!-- Arrow from GA to MCS -->
    <line x1="244" y1="85" x2="232" y2="85" stroke="#ca8a04" stroke-width="1.5"/>
    <polygon points="233,82 229,85 233,88" fill="#ca8a04"/>

    <!-- Step 5: Monte Carlo -->
    <rect x="180" y="74" width="50" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="3"/>
    <text x="205" y="83" text-anchor="middle" font-size="6.5" font-weight="700" fill="#166534">Monte</text>
    <text x="205" y="92" text-anchor="middle" font-size="5.5" fill="#166534">Carlo MCS</text>

    <!-- Output arrow -->
    <line x1="205" y1="96" x2="205" y2="108" stroke="#16a34a" stroke-width="1.5"/>
    <polygon points="202,107 205,111 208,107" fill="#16a34a"/>
    <rect x="180" y="111" width="172" height="13" fill="#bbf7d0" stroke="#86efac" stroke-width="1" rx="2"/>
    <text x="267" y="120" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Optimized Process Window — Defects ↓ Yield ↑</text>
    <rect class="tip" x="175" y="127" width="188" height="14" fill="#78350f" rx="3"/>
    <text class="tip" x="269" y="137" text-anchor="middle" font-size="6.5" fill="#fff">Ti-6242 · AISI 4340 · M50 steel · Hot forging · Deep draw</text>
  </g>

  <!-- ══ RIGHT: Instability Map ══ -->
  <g class="grp">
    <rect class="grp-bg" x="372" y="26" width="154" height="120" fill="#fff7ed" rx="5"/>
    <rect x="376" y="30" width="146" height="112" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" rx="3"/>
    <text x="449" y="42" text-anchor="middle" font-size="7" font-weight="700" fill="#9a3412">INSTABILITY MAP (FEM)</text>

    <!-- Axes -->
    <line x1="398" y1="50" x2="398" y2="118" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="398" y1="118" x2="508" y2="118" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="449" y="130" text-anchor="middle" font-size="6" fill="#6b7280">Strain Rate</text>
    <text x="388" y="84" text-anchor="middle" font-size="6" fill="#6b7280" transform="rotate(-90,388,84)">Temperature</text>

    <!-- Safe region (green) -->
    <rect x="418" y="54" width="80" height="48" fill="#bbf7d0" stroke="#16a34a" stroke-width="1" rx="2"/>
    <!-- Instability region (red) -->
    <polygon points="398,102 430,54 398,54" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <!-- Optimal path -->
    <path d="M 420,100 Q 440,72 488,58" stroke="#f97316" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <circle cx="454" cy="80" r="4" fill="#f97316"/>
    <text x="460" y="78" font-size="5.5" font-weight="700" fill="#c2410c">Optimal</text>

    <!-- Legend -->
    <rect x="398" y="104" width="8" height="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.8"/>
    <text x="409" y="110" font-size="5.5" fill="#166534">Safe zone</text>
    <rect x="438" y="104" width="8" height="6" fill="#fecaca" stroke="#dc2626" stroke-width="0.8"/>
    <text x="449" y="110" font-size="5.5" fill="#991b1b">Instability</text>
    <rect class="tip" x="380" y="127" width="138" height="14" fill="#7c2d12" rx="3"/>
    <text class="tip" x="449" y="137" text-anchor="middle" font-size="6.5" fill="#fff">RL-guided param selection → fracture/wrinkle ↓</text>
  </g>

  <!-- ══ BOTTOM STRIP ══ -->
  <rect y="154" width="540" height="26" fill="#fff7ed"/>
  <line y1="154" x2="540" y2="154" stroke="#fed7aa" stroke-width="1"/>
  <text x="14" y="165" font-size="7.5" font-weight="700" fill="#374151">Method</text>
  <text x="14" y="176" font-size="7" fill="#6b7280">DES · FEM · DNN Surrogate · Genetic Algorithm · Monte Carlo · RL-based Process Control</text>
  <rect x="432" y="157" width="46" height="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="3"/>
  <text x="455" y="168" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Throughput ↑</text>
  <rect x="484" y="157" width="48" height="16" fill="#fef3c7" stroke="#fde68a" stroke-width="1" rx="3"/>
  <text x="508" y="168" text-anchor="middle" font-size="7" font-weight="600" fill="#78350f">IJAMT · JMR</text>
</svg>
</body>
</html>
