<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IO-LAB Research Animation</title>
<style>
  html,body{margin:0;height:100%;background:#0e1424;overflow:hidden;font-family:"Segoe UI","Pretendard","Malgun Gothic",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#fff;transition:opacity .35s;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #stage.out{opacity:0}
  #stage svg{width:100%;height:100%;display:block}
  svg text{font-family:"Segoe UI","Pretendard","Malgun Gothic",sans-serif}
  #bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
       background:rgba(15,22,40,.82);color:#fff;padding:8px 12px;border-radius:12px;transition:opacity .4s;font-size:13px}
  #bar.hide{opacity:0;pointer-events:none}
  #bar button{background:#26314f;color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  #bar button.on{background:#4b7bec}
  #prog{position:fixed;left:0;bottom:0;height:3px;background:#4b7bec;width:0}
  .paused *{animation-play-state:paused!important}

  .fade{animation:fadeUp .7s ease-out both;animation-delay:var(--d,0s)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d,0s)}
  @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  .draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1s ease-out forwards;animation-delay:var(--d,0s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .flowS{stroke-dasharray:3 6;animation:flowS .8s linear infinite}
  @keyframes flowS{to{stroke-dashoffset:-9}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .blink{animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.2}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.1)}}
  .growY{transform-box:fill-box;transform-origin:50% 100%;animation:growY .8s ease-out both;animation-delay:var(--d,0s)}
  @keyframes growY{from{transform:scaleY(0)}}
  .growX{transform-box:fill-box;transform-origin:0 50%;animation:growX .8s ease-out both;animation-delay:var(--d,0s)}
  @keyframes growX{from{transform:scaleX(0)}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
  @keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
  .hl{animation:hl 4.5s infinite;animation-delay:var(--d,0s)}
  @keyframes hl{0%,30%{fill:#b8eedf;stroke:#2ec4a0}36%,100%{fill:#f4f4f8;stroke:#a9adbd}}
  .seq{animation:seq 3s infinite;animation-delay:var(--d,0s)}
  @keyframes seq{0%,28%{stroke-width:5}36%,100%{stroke-width:2}}
  .glowN{animation:glowN 1.8s infinite;animation-delay:var(--d,0s)}
  @keyframes glowN{0%,40%{fill:#2ec4a0}60%,100%{fill:#fff}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar">
  <button id="prev" title="이전 (←)">◀</button>
  <button id="play" title="재생/정지 (Space)">❚❚</button>
  <button id="next" title="다음 (→)">▶</button>
  <span style="width:8px"></span>
  <button class="dot" data-i="0">1 Integrated Logistics</button>
  <button class="dot" data-i="1">2 Resilient Network</button>
  <button class="dot" data-i="2">3 Next-Gen Optimization</button>
  <button class="dot" data-i="3">4 Intelligent Production</button>
  <span style="width:8px"></span>
  <button id="rep" title="현재 장면 반복">반복</button>
  <button id="fs" title="전체화면 (F)">⛶</button>
</div>
<div id="prog"></div>
<script>
/* ---------- primitives ---------- */
const at=o=>Object.entries(o).filter(([,v])=>v!==undefined&&v!==null).map(([k,v])=>`${k}="${v}"`).join(' ');
const el=(t,o,inner)=>inner==null?`<${t} ${at(o)}/>`:`<${t} ${at(o)}>${inner}</${t}>`;
const R=(x,y,w,h,o={})=>el('rect',{x,y,width:w,height:h,rx:o.rx||0,fill:o.f||'none',stroke:o.s||'none','stroke-width':o.sw||1.5,...(o.a||{})});
const C=(cx,cy,r,o={})=>el('circle',{cx,cy,r,fill:o.f||'none',stroke:o.s||'none','stroke-width':o.sw||2,...(o.a||{})});
const E=(cx,cy,rx,ry,o={})=>el('ellipse',{cx,cy,rx,ry,fill:o.f||'none',stroke:o.s||'none','stroke-width':o.sw||2,...(o.a||{})});
const P=(d,o={})=>el('path',{d,fill:o.f||'none',stroke:o.s||'none','stroke-width':o.sw||2,'stroke-linejoin':'round','stroke-linecap':'round',...(o.m?{'marker-end':`url(#m-${o.m})`}:{}),...(o.a||{})});
const L=(x1,y1,x2,y2,o={})=>el('line',{x1,y1,x2,y2,stroke:o.s||'#0b1f4d','stroke-width':o.sw||2,'stroke-linecap':'round',...(o.m?{'marker-end':`url(#m-${o.m})`}:{}),...(o.a||{})});
const arr=(x1,y1,x2,y2,r1,r2,o={})=>{const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;return L(+(x1+ux*r1).toFixed(1),+(y1+uy*r1).toFixed(1),+(x2-ux*r2).toFixed(1),+(y2-uy*r2).toFixed(1),o)};
const dr=d=>({class:'draw',pathLength:1,style:`--d:${d}s`});
const A=(cls,d,inner)=>`<g class="${cls}" style="--d:${d}s">${inner}</g>`;
const G=(cls,inner,style='')=>`<g class="${cls}" style="${style}">${inner}</g>`;
const tr=(x,y,inner,s)=>`<g transform="translate(${x},${y})${s?` scale(${s})`:''}">${inner}</g>`;
function T(x,y,s,o={}){
  const lines=Array.isArray(s)?s:[s],fs=o.fs||16,lh=o.lh||fs*1.2;
  const a=at({'font-size':fs,'font-weight':o.fw||500,fill:o.c||'#0b1f4d','text-anchor':o.a||'start','font-style':o.it?'italic':undefined,transform:o.rot});
  if(lines.length===1)return `<text x="${x}" y="${y}" ${a}>${lines[0]}</text>`;

}
function lbl(x,y,s,o={}){const fs=o.fs||15,w=s.length*fs*0.53+24;return R(x-w/2,y-15,w,30,{rx:8,f:'#fff',s:o.s||'#1b2a4a',sw:1.5})+T(x,y+5,s,{fs,a:'middle',fw:600,c:o.c||'#0b1f4d'})}
function pill(x,y,s,o={}){const fs=o.fs||17,w=o.w||s.length*fs*0.56+30;return R(x-w/2,y-16,w,32,{rx:16,f:o.f||'#e9edf3'})+T(x,y+6,s,{fs,a:'middle',fw:o.fw||600,c:o.c||'#334'})}
function mv(inner,path,dur,o={}){
  const b=o.begin||0;
  let s=`<g>${inner}<animateMotion path="${path}" dur="${dur}s" begin="${b}s" repeatCount="indefinite"${o.rot?' rotate="auto"':''}${o.kp?` keyPoints="${o.kp}" keyTimes="${o.kt}" calcMode="linear"`:''}/>`;
  if(o.fade)s+=`<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="${dur}s" begin="${b}s" repeatCount="indefinite"/>`;

function gear(r,n,stroke,fill,sw=3){let d='';for(let i=0;i<n*2;i++){const a1=i*Math.PI/n,a2=(i+1)*Math.PI/n,rr=i%2?r*0.76:r;d+=(i?'L':'M')+(rr*Math.cos(a1)).toFixed(1)+','+(rr*Math.sin(a1)).toFixed(1)+'A'+rr+','+rr+' 0 0 1 '+(rr*Math.cos(a2)).toFixed(1)+','+(rr*Math.sin(a2)).toFixed(1)}return P(d+'Z',{s:stroke,f:fill,sw})+C(0,0,r*.32,{f:'#fff',s:stroke,sw})}

const DEFS=`<defs>

</defs>`;

  for(let k=0;k<cap;k++)s+=mv(capsule(c),`M${x+42},${y+h/2} H${x+w-42}`,7,{begin:-k*7/cap,fade:1});

}

  s+=A('fade',3.6,L(700,350,700,372,{s:'#7fa9e6',sw:4,m:'b'}));
  // card 2

/* ---------- player ---------- */
const SC=[scene1,scene2,scene3,scene4],DUR=[16,16,17,18];
const stage=document.getElementById('stage'),prog=document.getElementById('prog'),bar=document.getElementById('bar');
const qs=new URLSearchParams(location.search);
let cur=Math.max(0,Math.min(3,(+qs.get('scene')||1)-1)),t=0,paused=false,repeat=false,last=performance.now(),busy=false;
function render(){stage.innerHTML=`<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">${DEFS}${SC[cur]()}</svg>`;
  if(paused)stage.querySelector('svg').pauseAnimations();
  document.querySelectorAll('.dot').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));}
function show(i,instant){cur=(i+SC.length)%SC.length;t=0;
  if(instant){render();return}
  if(busy)return;busy=true;stage.classList.add('out');setTimeout(()=>{render();stage.classList.remove('out');busy=false},350);}
function setPause(p){paused=p;stage.classList.toggle('paused',p);const sv=stage.querySelector('svg');if(sv)p?sv.pauseAnimations():sv.unpauseAnimations();document.getElementById('play').textContent=p?'►':'❚❚';}
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused&&!busy){t+=dt;if(t>=DUR[cur]){repeat?show(cur):show(cur+1)}}
  prog.style.width=(Math.min(1,t/DUR[cur])*100)+'%';requestAnimationFrame(tick);}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('play').onclick=()=>setPause(!paused);
document.getElementById('rep').onclick=e=>{repeat=!repeat;e.target.classList.toggle('on',repeat)};
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>show(+b.dataset.i));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);else if(e.key===' '){e.preventDefault();setPause(!paused)}else if(e.key==='f'||e.key==='F')document.getElementById('fs').click();else if(e.key>='1'&&e.key<='4')show(+e.key-1)});
let hideT;const wake=()=>{bar.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>bar.classList.add('hide'),2500)};
addEventListener('mousemove',wake);wake();
if(qs.get('ui')==='0'){bar.style.display='none';prog.style.display='none';stage.style.boxShadow='none';document.body.style.background='#fff';}
if(qs.get('loop')==='1')repeat=true;
show(cur,true);requestAnimationFrame(tick);
